packages: []

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  es5-ext: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Allow native dependency build scripts (pnpm v11 blocks them by default).
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - es5-ext
  - esbuild
  - prisma
  - sharp
  - unrs-resolver

# Don't re-run dependency verification before every script.
verifyDepsBeforeRun: false
